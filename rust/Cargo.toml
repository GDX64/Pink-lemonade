[workspace]
members = [
    ".",
    "progressive-common",
    "progressive-core",
    "progressive-harness",
    "progressive-naive",
    "progressive-tree",
    "progressive-kdtree",
    "progressive-ripmap",
    "progressive-quadtree",
]

[package]
name = "pink-lemonade-wasm"
version = "0.1.0"
edition = "2024"

[dependencies]
wasm-bindgen = "0.2.113"

[lib]
crate-type = ["cdylib", "rlib"]

[[bench]]
name = "merge"
harness = false

[[bench]]
name = "tree_merge"
harness = false

[profile.release]
strip = true
debug = false
opt-level = 3
lto = true
codegen-units = 1

[profile.fast]
inherits = "dev"
opt-level = 2
